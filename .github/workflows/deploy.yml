name: Deploy PvZ Evolution & Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build Web Bundle
        run: |
          npm install
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-apk:
    runs-on: ubuntu-latest
    # Precisa escrever no repositório para atualizar o APK na página de Releases
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & Build Web Bundle
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Build Debug APK via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cerca-Viva-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Link fixo e público para baixar o APK (o artefato acima exige login no GitHub e expira):
      # https://github.com/JoaoMagalhaes321/cerca-viva/releases/download/android/cerca-viva.apk
      - name: Publicar o APK no link fixo de download (Releases)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk cerca-viva.apk
          NOTAS="Cerca Viva para Android. Baixe o cerca-viva.apk e abra no celular (o Android pede para permitir instalar apps desta origem). Atualizado sozinho a cada deploy: build ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA::7}."
          if gh release view android >/dev/null 2>&1; then
            gh release upload android cerca-viva.apk --clobber
            gh release edit android --notes "$NOTAS"
          else
            gh release create android cerca-viva.apk --title "Cerca Viva para Android" --notes "$NOTAS" --latest
          fi
